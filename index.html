<style>
/* Layout: visor 3D a la izquierda como en Civil 3D / Navisworks; panel de trabajo a la derecha; etapas del proyecto como pestañas superiores. Tema oscuro único (visor de ingeniería). */
:root{

  --stake:#e6b450; --water:#57b6dc; --clash:#e5534b; --ok:#4fae7f; --cut:#b8674a; --fill:#6f9a4e;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif; --f-data:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;margin:0;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;line-height:1.05}
.brand span{color:var(--mute);font-size:12px}
nav.steps{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.steps button{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 12px;border-radius:3px;cursor:pointer;display:flex;gap:7px;align-items:center}
nav.steps button i{font-style:normal;font-family:var(--f-data);font-size:11px;border:1px solid currentColor;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
nav.steps button[aria-selected="true"]{color:var(--bg);background:var(--stake);border-color:var(--stake)}
nav.steps button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--stake);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 390px;min-height:0}
#view{position:relative;min-height:0;overflow:hidden}
#view canvas{display:block}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--f-display);font-size:14px;font-weight:600;margin:0 0 6px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
p{margin:0;line-height:1.5;color:#c4ced2}
.eyebrow{font-family:var(--f-data);font-size:11px;color:var(--stake);letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-body);font-weight:600;font-size:13px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:7px 11px;border-radius:3px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--stake);color:#1b1404;border-color:var(--stake)}
.btn[aria-pressed="true"]{border-color:var(--stake);color:var(--stake)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
.kpi small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-data);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{border:1px solid var(--line);border-left:3px solid var(--clash);background:var(--panel2);padding:10px 12px;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card.ok{border-left-color:var(--ok)}
.card:hover{border-color:var(--mute)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .t b{font-family:var(--f-display);font-size:17px;font-weight:600}
.pill{font-family:var(--f-data);font-size:10.5px;padding:2px 6px;border-radius:2px;background:rgba(229,83,75,.16);color:var(--clash);white-space:nowrap}
.pill.ok{background:rgba(79,174,127,.16);color:var(--ok)}
.pill.w{background:rgba(87,182,220,.15);color:var(--water)}
.card p{font-size:12.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.cmp div{background:var(--bg);padding:6px 8px;border-radius:2px}
.cmp small{color:var(--mute);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.cmp b{font-family:var(--f-data);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding:4px 4px}
td{padding:4px 4px;border-bottom:1px solid #1e282d;vertical-align:top}
td.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cap td{color:var(--stake);font-weight:600;font-size:11px;padding-top:8px}
.tbl{overflow-x:auto}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--stake)}
canvas.chart{width:100%;height:180px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:2px}
canvas.sec{height:170px}
label.tg{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--stake)}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:5px;border-radius:3px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* overlays */
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud .tag{background:rgba(14,19,22,.82);border:1px solid var(--line);padding:6px 10px;border-radius:3px;font-family:var(--f-data);font-size:12px}
.hud .tag b{color:var(--stake);font-weight:500}
.lbl{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--f-data);font-size:11px;white-space:nowrap;transform:translate(-50%,-100%);color:var(--fg);text-shadow:0 1px 2px #000,0 0 6px #000}
.lbl.km{color:var(--stake)}
.lbl.drain{pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);padding:5px 8px;border:1px solid #57b6dc;background:rgba(10,24,30,.94);color:#d9f5ff;border-radius:3px;box-shadow:0 0 16px rgba(87,182,220,.55);font-weight:600}
.lbl.svc{color:var(--water)}
.lbl.cl{pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;color:#fff}
.lbl.cl i{width:16px;height:16px;border-radius:50%;border:2px solid var(--clash);background:rgba(229,83,75,.35);animation:pulse 1.4s infinite}
.lbl.cl.ok i{border-color:var(--ok);background:rgba(79,174,127,.35);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,83,75,.7)}100%{box-shadow:0 0 0 14px rgba(229,83,75,0)}}
.timeline{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(14,19,22,.95) 30%);padding-block:22px 12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;gap:10px;align-items:center}
.timeline .btn{min-width:84px}
.timeline .d{font-family:var(--f-data);font-size:13px;min-width:118px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.alert{position:absolute;right:14px;top:12px;max-width:min(360px,calc(100% - 28px));background:rgba(40,14,13,.94);border:1px solid var(--clash);border-radius:3px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.alert b{font-family:var(--f-display);font-size:16px;color:var(--clash);letter-spacing:.03em}
.note{font-size:11.5px;color:var(--mute);line-height:1.45;border-top:1px solid var(--line);padding-top:10px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-family:var(--f-data)}
@media (max-width:900px){
  .timeline{flex-wrap:wrap;padding-top:16px}
  .timeline input[type=range]{flex:1 1 100%;order:-1}
  .timeline .d{min-width:0;margin-left:auto}
  body{overflow:auto}
  .app{height:auto}
  main{grid-template-columns:1fr}
  #view{height:58vh;min-height:340px}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}
  nav.steps{margin-left:0}
  nav.steps button{font-size:13px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.lbl.cl i{animation:none}}
</style>
